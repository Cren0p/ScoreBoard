<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천타버스 스코어보드</title>
<link rel="icon" type="image/webp" href="https://github.com/Cren0p/ScoreBoard/blob/main/Favicon.webp?raw=true">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg:#080810; --surface:#0f0f1a; --card:#141428;
  --border:#1e1e34; --text:#e4e4f4; --muted:#52527a;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --accent:#00C9A7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.wrap{max-width:1260px;margin:0 auto;padding:28px 20px 60px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:1.5rem;font-weight:800;}
.page-title span{background:linear-gradient(135deg,#00C9A7,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.badge{font-size:.7rem;background:var(--border);color:var(--muted);padding:4px 11px;border-radius:20px;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#2ED573;display:inline-block;margin-right:5px;}

.pnav.active{background:var(--card);color:var(--text);}
.pnav.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#00C9A7,#7C3AED);}


/* 멤버 선택 그리드 */
.msel.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,201,167,.2);}
.msel.on .msel-img{border-color:var(--accent);}
.msel.on .msel-name{color:var(--text);}


.btn{padding:8px 18px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:.82rem;transition:all .18s;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--muted);}
.btn-sm{padding:5px 12px;font-size:.75rem;}

/* 게임 화면 */

/* 점수판 테이블 */
.score-table-wrap{overflow-x:auto;margin-bottom:24px;}
.score-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);}
.score-table th,.score-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:center;font-size:.82rem;white-space:nowrap;}
.score-table th{background:var(--card);font-weight:800;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;}
.score-table tr:last-child td{border-bottom:none;}
.score-table .td-name{display:flex;align-items:center;justify-content:center;gap:8px;}
.score-table .td-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;}
.score-table .td-total{font-weight:800;color:var(--accent);font-size:.9rem;}


/* OV BOX */

/* 모달 */

/* 오버레이 */
body.ovm{background:transparent !important;}
body.ovm #app{background:transparent;}
.ov-stage{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.ov-panel{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.5);padding:10px 14px;width:max-content;transform-origin:center;}
.ov-panel.dark{background:rgba(255,255,255,.6);}
.ov-panel.cap-left{flex-direction:row;gap:16px;}
.ov-panel.cap-right{flex-direction:row-reverse;gap:16px;}
.ov-panel.cap-bottom{flex-direction:column-reverse;}
.ov-caption{font-size:1.15rem;font-weight:800;color:#fff;white-space:pre-line;text-align:center;}
.ov-panel.dark .ov-caption{color:#111;}
.ov-grid{display:grid;gap:2px 10px;width:max-content;}
.ov-grid.teams{gap:6px 20px;}
.ov-tcard-members{display:grid;gap:2px 14px;}
.ov-card{background:transparent;padding:2px 4px;display:flex;align-items:center;gap:6px;}
.ov-card-rank{min-width:2.3em;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900;flex-shrink:0;white-space:nowrap;}
.ovr1{color:#FFD700;}
.ovr2,.ovr3,.ovr-etc{color:rgba(255,255,255,.6);}
.ov-panel.dark .ovr1{color:#B8860B;}
.ov-panel.dark .ovr2,.ov-panel.dark .ovr3,.ov-panel.dark .ovr-etc{color:rgba(0,0,0,.55);}
.ov-grid.dark .ov-card-score{color:#111;}
.ov-tcard{background:transparent;padding:2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.ov-tcard-head{display:grid;grid-template-columns:repeat(2,max-content);justify-content:center;align-items:center;column-gap:8px;}
.ov-tcard-head.single,.ov-tcard-head.wide{display:flex;justify-content:center;align-items:center;gap:6px;}
.ov-tcard-head .ov-card-rank{font-size:1.25rem;}
.ov-tcard-name{font-size:.95rem;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;max-width:130px;text-align:center;}
.ov-grid.dark .ov-tcard-name{color:#111;}
.ov-tcard-round{font-size:1.3rem;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;max-width:110px;font-variant-numeric:tabular-nums;text-align:center;}
.ov-panel.dark .ov-tcard-round{color:#111;}
.ov-tcard-total{font-size:1.3rem;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;max-width:110px;font-variant-numeric:tabular-nums;text-align:center;}
.ov-tcard-total.sub{font-size:.85rem;font-weight:700;opacity:.7;}
.ov-grid.dark .ov-tcard-total{color:#111;}
.ov-tm{display:flex;align-items:center;gap:6px;}
.ov-tm-av{width:32px;height:32px;object-fit:cover;flex-shrink:0;}
.ov-tm-info{min-width:0;}
.ov-tm-name{font-size:.8rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;max-width:100px;}
.ov-tm-score{font-size:.8rem;font-weight:700;color:#fff;opacity:.75;white-space:nowrap;overflow:hidden;max-width:100px;font-variant-numeric:tabular-nums;}
.ov-grid.dark .ov-tm-score{color:#111;}
.ov-card-av{width:36px;height:36px;border-radius:3px;object-fit:cover;flex-shrink:0;}
.ov-card-info{min-width:0;}
.ov-card-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;max-width:110px;}
.ov-card-score{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;opacity:.85;white-space:nowrap;overflow:hidden;max-width:110px;}
.ov-empty{opacity:.25;}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><div id="loadMsg">Firebase SDK 로딩 중...</div></div></div>

<script>
window.addEventListener('load', function() {
  const msg = document.getElementById('loadMsg');
  if (!msg) return;
  if (typeof firebase === 'undefined') {
    msg.innerHTML = '❌ Firebase SDK 로드 실패';
    return;
  }
  msg.textContent = 'Firebase 초기화 중...';
});
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAJmePUKepIjsrSLoqLKO9EjhipdnnheaY",
  authDomain: "lifegame-26c6c.firebaseapp.com",
  databaseURL: "https://lifegame-26c6c-default-rtdb.firebaseio.com",
  projectId: "lifegame-26c6c",
  storageBucket: "lifegame-26c6c.firebasestorage.app",
  messagingSenderId: "723913370465",
  appId: "1:723913370465:web:999650fa0d05a9ad39f320"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const STATE_REF = db.ref('chameleon/state');

// 모든 데이터(참여자·점수·색·설정)는 구글 시트에서 입력하고,
// 시트에 설치된 Apps Script가 편집 즉시 Firebase로 밀어넣는다.
// 이 페이지는 표시 전용: 기본 = 현황, ?overlay = OBS 오버레이.
const isOv = location.search.indexOf('overlay') !== -1;
if (isOv) {
  document.body.classList.add('ovm');
  document.getElementById('app').innerHTML = '';
}

let state = null;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function soopImg(id) { return `https://profile.img.sooplive.com/LOGO/${id.slice(0,2)}/${id}/${id}.jpg`; }

// 단위 규칙: 값이 순수 숫자(콤마·소수점·부호 허용)면 단위를 붙이고, 텍스트 섞인 값은 그대로
function withUnit(t, unit) {
  const s = String(t);
  return (unit && /^-?[0-9][0-9,]*(\.[0-9]+)?$/.test(s.trim())) ? s + unit : s;
}
function dispScore(t) { return withUnit(t, state.unit); }         // D1: 게임 점수 단위
function dispRound(t) { return withUnit(t, state.roundUnit); }    // J1: 라운드 점수 단위

// D열 셀 텍스트("12,500원", "$300", "85%")에서 정렬용 숫자 추출
function scoreNum(t) {
  const n = parseFloat(String(t).replace(/,/g, '').replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function sanitize(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  let rows = Array.isArray(s.rows) ? s.rows : Object.values(s.rows || {});
  rows = rows.filter(r => r && typeof r === 'object').map(r => ({
    id: String(r.id || ''),
    nick: String(r.nick || r.id || ''),
    color: (typeof r.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(r.color)) ? r.color : '',
    score: String(r.score === undefined || r.score === null || r.score === '' ? '0' : r.score),
    team: typeof r.team === 'string' ? r.team.trim() : '',
    teamScore: typeof r.teamScore === 'string' ? r.teamScore.trim() : '',
  }));
  return {
    rows,
    textDark: s.textDark === true,
    cols: (typeof s.cols === 'number' && s.cols >= 1 && s.cols <= 12) ? s.cols : 0,
    showRank: s.showRank !== false,
    overlayOn: s.overlayOn !== false,
    teamCols: (typeof s.teamCols === 'number' && s.teamCols >= 1 && s.teamCols <= 12) ? s.teamCols : 0,
    caption: typeof s.caption === 'string' ? s.caption : '',
    unit: typeof s.unit === 'string' ? s.unit.trim() : '',
    roundUnit: typeof s.roundUnit === 'string' ? s.roundUnit.trim() : '',
    captionPos: ['top', 'left', 'right', 'bottom'].indexOf(s.captionPos) !== -1 ? s.captionPos : 'top',
    updatedAt: typeof s.updatedAt === 'number' ? s.updatedAt : 0,
  };
}

// I열에 팀명이 하나라도 있으면 팀전 모드
function isTeamMode() {
  return state.rows.some(r => r.team);
}

// 팀전: 팀명 빈 행은 미참가. 시트 등장 순서로 묶고, 순위 표시 시 합계 내림차순 + 공동 순위
function rankedTeams() {
  const teams = [];
  const byName = {};
  state.rows.forEach(r => {
    if (!r.team) return;
    if (!byName[r.team]) {
      byName[r.team] = { name: r.team, members: [], total: 0 };
      teams.push(byName[r.team]);
    }
    byName[r.team].members.push(r);
    byName[r.team].total += scoreNum(r.score);
    if (!byName[r.team].round && r.teamScore) byName[r.team].round = r.teamScore;
  });
  if (!state.showRank) return teams;
  teams.forEach(t => t.members.sort((a, b) => scoreNum(b.score) - scoreNum(a.score)));
  // 라운드 점수(J열)가 하나라도 있으면 라운드 우선, 동률이면 합계로 정렬
  const useRound = teams.some(t => t.round);
  const key = t => useRound ? scoreNum(t.round || '') : t.total;
  teams.sort((a, b) => (key(b) - key(a)) || (b.total - a.total));
  teams.forEach((t, i) => {
    const same = i > 0 && key(t) === key(teams[i - 1]) && t.total === teams[i - 1].total;
    t.rank = same ? teams[i - 1].rank : i + 1;
  });
  return teams;
}

// 순위 표시: 점수 내림차순 + 동점 공동 순위 / 순위 숨김: 시트 행 순서 그대로
function ranked() {
  if (!state.showRank) return state.rows.map(r => ({ ...r }));
  const arr = state.rows.map(r => ({ ...r, num: scoreNum(r.score) })).sort((a, b) => b.num - a.num);
  arr.forEach((p, i) => {
    p.rank = (i > 0 && p.num === arr[i - 1].num) ? arr[i - 1].rank : i + 1;
  });
  return arr;
}

// ── 현황 페이지 (읽기 전용) ──────────────────────────────────────
let connected = false;
let everConnected = false;

db.ref('.info/connected').on('value', snap => {
  connected = snap.val() === true;
  if (connected) everConnected = true;
  updateConn();
});

function updateConn() {
  const lost = everConnected && !connected;
  document.querySelectorAll('.conn-dot').forEach(d => { d.style.background = lost ? '#FF4757' : '#2ED573'; });
  document.querySelectorAll('.conn-txt').forEach(t => { t.textContent = lost ? '연결 끊김' : 'Firebase 연결됨'; });
}

function renderStatus() {
  const arr = ranked();
  const teamMode = isTeamMode();
  const rows = arr.map(p => `<tr>
    ${state.showRank ? `<td style="text-align:center;font-weight:900;">${p.rank}</td>` : ''}
    ${teamMode ? `<td>${esc(p.team || '—')}</td>` : ''}
    <td><div class="td-name">
      <img class="td-avatar" src="${soopImg(p.id)}" alt="${esc(p.nick)}" onerror="this.style.opacity=0">
      ${esc(p.nick)}
    </div></td>
    <td class="td-total">${esc(dispScore(p.score))}</td>
  </tr>`).join('');

  document.getElementById('app').innerHTML = `<div class="wrap">
    <div class="page-header">
      <div class="page-title"><span>천타버스</span> 스코어보드</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:.7rem;color:var(--muted);">마지막 반영 ${state.updatedAt ? new Date(state.updatedAt).toTimeString().slice(0, 8) : '—'}</span>
        <span class="badge"><span class="conn-dot"></span><span class="conn-txt">Firebase 연결됨</span></span>
        <a class="btn btn-ghost btn-sm" href="?overlay" target="_blank" rel="noopener" style="text-decoration:none;">오버레이</a>
        <button class="btn btn-ghost btn-sm" id="btnCopyOv">링크 복사</button>
      </div>
    </div>
    <div class="score-table-wrap"><table class="score-table">
      <thead><tr>${state.showRank ? '<th style="width:64px;">순위</th>' : ''}${teamMode ? '<th>팀</th>' : ''}<th>멤버</th><th>점수</th></tr></thead>
      <tbody>${rows.length ? rows : `<tr><td colspan="${(state.showRank ? 3 : 2) + (teamMode ? 1 : 0)}" style="text-align:center;color:var(--muted);padding:24px;">시트에 등록된 멤버가 없습니다</td></tr>`}</tbody>
    </table></div>
  </div>`;
  updateConn();

  const copyBtn = document.getElementById('btnCopyOv');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    const url = location.origin + location.pathname + '?overlay';
    const done = () => {
      copyBtn.textContent = '복사됨 ✓';
      setTimeout(() => { copyBtn.textContent = '링크 복사'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
    } else {
      fallbackCopy(url, done);
    }
  });
}

// 클립보드 API를 못 쓰는 환경용 폴백
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

// ── OBS 오버레이 ─────────────────────────────────────────────────
// 자막 + 그리드를 감싸는 전체 패널 (자막 위치에 따라 배치 방향 결정)
function wrapPanel(gridHtml) {
  const posCls = state.captionPos !== 'top' ? ' cap-' + state.captionPos : '';
  const cap = state.caption ? `<div class="ov-caption">${esc(state.caption)}</div>` : '';
  return `<div class="ov-panel${state.textDark ? ' dark' : ''}${posCls}">${cap}${gridHtml}</div>`;
}

function renderOverlay() {
  const app = document.getElementById('app');
  if (!state || !state.overlayOn || state.rows.length === 0) { app.innerHTML = ''; return; }

  if (isTeamMode()) { renderTeamOverlay(app); return; }

  const arr = ranked();
  const cols = Math.min(state.cols > 0 ? state.cols : 4, arr.length);
  const cells = arr.map(p => {
    const rank = p.rank;
    const rankCls = rank === 1 ? 'ovr1' : rank === 2 ? 'ovr2' : rank === 3 ? 'ovr3' : 'ovr-etc';
    const nameColor = p.color || (state.textDark ? '#111' : '#fff');
    return `<div class="ov-card">
      ${state.showRank ? `<div class="ov-card-rank ${rankCls}">${rank}등</div>` : ''}
      <img class="ov-card-av" src="${soopImg(p.id)}" alt="${esc(p.nick)}" onerror="this.style.opacity=0">
      <div class="ov-card-info">
        <div class="ov-card-name" style="color:${nameColor}">${esc(p.nick)}</div>
        <div class="ov-card-score">${esc(dispScore(p.score))}</div>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `<div class="ov-stage">${wrapPanel(`<div class="ov-grid${state.textDark ? ' dark' : ''}" style="grid-template-columns:repeat(${cols},max-content);">${cells}</div>`)}</div>`;
  fitCardText();
  uniformColumns();
  fitOverlay();
}

function renderTeamOverlay(app) {
  const teams = rankedTeams();
  if (teams.length === 0) { app.innerHTML = ''; return; }

  const cols = Math.min(state.teamCols > 0 ? state.teamCols : 4, teams.length);
  const cells = teams.map(t => {
    const rankCls = t.rank === 1 ? 'ovr1' : t.rank === 2 ? 'ovr2' : t.rank === 3 ? 'ovr3' : 'ovr-etc';
    const memberCols = Math.min(state.cols > 0 ? state.cols : 1, t.members.length);
    const members = t.members.map(m => {
      const nameColor = m.color || (state.textDark ? '#111' : '#fff');
      return `<div class="ov-tm">
        <img class="ov-tm-av" src="${soopImg(m.id)}" alt="${esc(m.nick)}" onerror="this.style.opacity=0">
        <div class="ov-tm-info">
          <div class="ov-tm-name" style="color:${nameColor}">${esc(m.nick)}</div>
          <div class="ov-tm-score">${esc(dispScore(m.score))}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="ov-tcard">
      <div class="ov-tcard-head${(state.showRank && t.round) ? '' : ' single'}">
        ${state.showRank ? `<div class="ov-card-rank ${rankCls}">${t.rank}등</div>` : ''}
        <div class="ov-tcard-name">${esc(t.name)}</div>
        ${t.round ? `<div class="ov-tcard-round">${esc(dispRound(t.round))}</div>` : ''}
        <div class="ov-tcard-total${t.round ? ' sub' : ''}">${esc(dispScore(t.total.toLocaleString('en-US')))}</div>
      </div>
      <div class="ov-tcard-members" style="grid-template-columns:repeat(${memberCols},max-content);">${members}</div>
    </div>`;
  }).join('');

  app.innerHTML = `<div class="ov-stage">${wrapPanel(`<div class="ov-grid teams${state.textDark ? ' dark' : ''}" style="grid-template-columns:repeat(${cols},max-content);">${cells}</div>`)}</div>`;
  fitCardText();
  uniformColumns();
  fitOverlay();
}

// 간격 균등화: content-fit으로 제각각인 칸 폭을 가장 넓은 칸 기준으로 통일
// — 개인전 카드끼리 / 팀 카드끼리 / 모든 팀에 걸친 멤버 칸끼리
function uniformColumns() {
  // ① 팀 헤더의 등수·팀명·라운드·합계를 각 클래스별 최대 폭으로 통일 (팀 간 줄 맞춤)
  ['.ov-tcard-head .ov-card-rank', '.ov-tcard-name', '.ov-tcard-round', '.ov-tcard-total'].forEach(sel => {
    const els = document.querySelectorAll(sel);
    if (els.length < 2) return;
    let max = 0;
    els.forEach(el => { el.style.width = ''; max = Math.max(max, el.offsetWidth); });
    els.forEach(el => { el.style.width = Math.ceil(max) + 'px'; });
  });
  // ② 모든 팀에 걸쳐 멤버 칸 폭 통일
  const memberCells = document.querySelectorAll('.ov-tm');
  if (memberCells.length) {
    let max = 0;
    memberCells.forEach(el => { max = Math.max(max, el.offsetWidth); });
    document.querySelectorAll('.ov-tcard-members').forEach(g => {
      const n = getComputedStyle(g).gridTemplateColumns.split(' ').length;
      if (max) g.style.gridTemplateColumns = `repeat(${n}, ${Math.ceil(max)}px)`;
    });
  }
  // ③ 헤더 단수 자동: 한 줄로 폈을 때 전 팀이 멤버 그리드 폭 안에 들어가면 한 줄, 아니면 2×2
  const heads = Array.from(document.querySelectorAll('.ov-tcard-head:not(.single)'));
  if (heads.length) {
    heads.forEach(h => h.classList.add('wide'));
    const fitsAll = heads.every(h => {
      const mg = h.parentElement.querySelector('.ov-tcard-members');
      return mg && h.offsetWidth <= mg.offsetWidth;
    });
    if (!fitsAll) heads.forEach(h => h.classList.remove('wide'));
  }
  // ④ 개인전 카드끼리 / 팀 카드끼리 동일 폭
  const grid = document.querySelector('.ov-grid');
  if (grid) {
    let max = 0;
    for (const c of grid.children) max = Math.max(max, c.offsetWidth);
    const n = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    if (max) grid.style.gridTemplateColumns = `repeat(${n}, ${Math.ceil(max)}px)`;
  }
}

// 칸을 넘치는 텍스트만 폰트 축소 (한 줄 유지, 한 번에 비율 계산)
// 이름: 기준의 60%까지(그 이하는 말줄임) / 점수: 잘림 방지를 위해 들어맞을 때까지(절대 하한 8px)
function fitCardText() {
  document.querySelectorAll('.ov-card-name, .ov-card-score, .ov-tcard-name, .ov-tcard-total, .ov-tcard-round, .ov-tm-name, .ov-tm-score').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth <= el.clientWidth) return;
    const base = parseFloat(getComputedStyle(el).fontSize);
    const fit = base * el.clientWidth / el.scrollWidth * 0.97;
    const isScore = el.classList.contains('ov-card-score') || el.classList.contains('ov-tcard-total') || el.classList.contains('ov-tcard-round') || el.classList.contains('ov-tm-score');
    el.style.fontSize = Math.max(fit, isScore ? 8 : base * 0.6) + 'px';
  });
}

function fitOverlay() {
  const grid = document.querySelector('.ov-panel');
  if (!grid) return;
  grid.style.transform = 'none';
  const w = grid.offsetWidth, h = grid.offsetHeight;
  if (!w || !h) return;
  const scale = Math.min((window.innerWidth - 32) / w, (window.innerHeight - 32) / h);
  grid.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', () => { if (isOv) fitOverlay(); });

// ── FIREBASE LISTENER (읽기 전용) ────────────────────────────────
STATE_REF.on('value', snapshot => {
  state = sanitize(snapshot.val());
  if (isOv) renderOverlay(); else renderStatus();
}, error => {
  console.error('Firebase error:', error);
  document.getElementById('app').innerHTML =
    '<div class="loading"><div style="color:#FF4757">Firebase 연결 실패</div><div style="font-size:.8rem;color:var(--muted)">' + error.message + '</div></div>';
});
</script>
